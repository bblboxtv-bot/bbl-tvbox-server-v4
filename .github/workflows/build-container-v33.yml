name: Build Container V3.3 APK

on:
  pull_request:
    branches: [ main ]
    paths:
      - 'container-v33-src/**'
      - '.github/workflows/build-container-v33.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;29.0.13846066"
      - name: Vendor BlackBox
        working-directory: container-v33-src
        run: bash setup_blackbox.sh
      - name: Install Gradle 8.9
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.9-bin.zip -O /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-8.9/bin" >> "$GITHUB_PATH"
      - name: Build APK
        working-directory: container-v33-src
        run: gradle --no-daemon :app:assembleBlackboxDebug
      - name: Verify APK
        run: |
          test -f container-v33-src/app/build/outputs/apk/blackbox/debug/app-blackbox-debug.apk
          ls -lh container-v33-src/app/build/outputs/apk/blackbox/debug/app-blackbox-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BBL-Container-V3.3-Corrigido
          path: container-v33-src/app/build/outputs/apk/blackbox/debug/app-blackbox-debug.apk
          if-no-files-found: error
