name: Build BBL BOXTV Launcher V5

on:
  push:
    branches: [launcher-v5-build]
    paths:
      - 'launcher-v5/android/**'
      - '.github/workflows/build-launcher-v5.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - name: Build debug APK
        working-directory: launcher-v5/android
        run: gradle --no-daemon :app:assembleDebug
      - name: Rename APK
        run: cp launcher-v5/android/app/build/outputs/apk/debug/app-debug.apk BBL_BOXTV_LAUNCHER_V5_CLIENTE_LOJA_APPS.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BBL_BOXTV_LAUNCHER_V5_CLIENTE_LOJA_APPS
          path: BBL_BOXTV_LAUNCHER_V5_CLIENTE_LOJA_APPS.apk
          if-no-files-found: error
